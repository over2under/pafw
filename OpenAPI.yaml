openapi: 3.0.1
info:
  title: Palo Alto Firewall Rules API
  version: 1.0.0
  description: Retrieve firewall security rules from a Palo Alto firewall using REST API.
servers:
  - url: https://57.167.90.200/restapi/v11.0
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-PAN-KEY
security:
  - ApiKeyAuth: []
paths:
  /Policies/SecurityRules:
    get:
      operationId: ListFirewallRules
      summary: List firewall security rules
      description: Returns configured security policy rules from the Palo Alto firewall.
      responses:
        '200':
          description: Firewall rules returned successfully

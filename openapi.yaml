openapi: 3.0.1
info:
  title: Palo Alto PAN-OS Security Copilot Plugin
  version: 2.0.0
  description: |
    Microsoft Security Copilot plugin for Palo Alto Networks PAN-OS.

    This API allows Security Copilot to:
    - List firewall security rules
    - List address objects
    - List address groups

servers:
  - url: http://57.167.90.200/restapi/v11.1

paths:
  /Policies/SecurityRules:
    get:
      operationId: ListFirewallRules
      summary: List Palo Alto firewall security rules
      description: |
        Retrieve all security policy rules configured in vsys1.

        Use this operation when a user requests:
        - List firewall rules
        - Show security rules
        - Display firewall policies
        - Show allow and deny rules
        - List PAN-OS security rules
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys
        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1
      responses:
        '200':
          description: Security rules returned successfully.

  /Objects/Addresses:
    get:
      operationId: ListAddressObjects
      summary: List Palo Alto address objects
      description: |
        Retrieve all address objects configured in vsys1.

        Use this operation when a user requests:
        - List address objects
        - Show address objects
        - Display IP objects
        - Show firewall address entries
        - Retrieve address definitions

        Returns object names, types, and values.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys
        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1
      responses:
        '200':
          description: Address objects returned successfully.

  /Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      summary: List Palo Alto address groups
      description: |
        Retrieve all address groups configured in vsys1.

        Use this operation when a user requests:
        - List address groups
        - Show address groups
        - Display object groups
        - Show members of address groups
        - List AbuseCH_Blocked_IPs members

        Returns group names and group membership.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys
        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1
      responses:
        '200':
          description: Address groups returned successfully.

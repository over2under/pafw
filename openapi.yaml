openapi: 3.0.0
info:
  title: Palo Alto PAN-OS Firewall Rule Reader
  version: 1.0.0
  description: Read-only access to local PAN-OS security policy rules through the XML API.
servers:
  - url: https://57.167.90.200
paths:
  /api/:
    get:
      operationId: ListPaloAltoSecurityRules
      summary: List security policy rules from vsys1
      description: |-
        Retrieves the configured local security policy rules from vsys1 by using the PAN-OS XML API.
        This is a read-only request.
        #ExamplePrompts List the firewall security rules on my Palo Alto firewall
        #ExamplePrompts Show the Palo Alto rules with source, destination, application, service, and action
        #ExamplePrompts Which Palo Alto firewall rules are disabled?
      parameters:
        - name: type
          in: query
          required: true
          description: PAN-OS request type. Always use config.
          schema:
            type: string
            enum: [config]
            default: config
        - name: action
          in: query
          required: true
          description: PAN-OS configuration action. Always use get.
          schema:
            type: string
            enum: [get]
            default: get
        - name: xpath
          in: query
          required: true
          description: XPath for local vsys1 security rules. Use the exact default value.
          schema:
            type: string
            enum:
              - "/config/devices/entry/vsys/entry[@name='vsys1']/rulebase/security/rules"
            default: "/config/devices/entry/vsys/entry[@name='vsys1']/rulebase/security/rules"
      responses:
        '200':
          description: PAN-OS XML response containing security rules or a PAN-OS API status message.
          content:
            application/xml:
              schema:
                type: string
        '400':
          description: Invalid or missing PAN-OS XML API parameter.
        '403':
          description: Authentication failed or the API administrator lacks permission.
        '500':
          description: PAN-OS management API error.

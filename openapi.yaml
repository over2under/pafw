openapi: 3.0.1

info:
  title: Palo Alto Firewall Rules
  version: 1.0.0
  description: |
    Retrieve Palo Alto firewall security rules.

servers:
  - url: https://57.167.90.200

paths:

  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules

      summary: List firewall security rules

      description: |
        Returns all Palo Alto firewall security rules.

        Use this operation whenever users ask:
        - Show firewall rules
        - List security rules
        - Display security policy
        - Show allow rules
        - Show deny rules
        - Review Palo Alto policy

      parameters:

        - name: location
          in: query
          required: true
          schema:
            type: string
            example: vsys

        - name: vsys
          in: query
          required: true
          schema:
            type: string
            example: vsys1

      responses:

        '200':
          description: Security rules were successfully returned

          content:
            application/json:

              schema:
                type: object

              example:

                result:

                  entry:

                    - "@name": "azure-healthprobe-allow"
                      action: "allow"

                    - "@name": "Block_Threat_Intel"
                      action: "deny"

security:

  - PanApiKey: []

components:

  securitySchemes:

    PanApiKey:
      type: apiKey
      in: header
      name: X-PAN-KEY

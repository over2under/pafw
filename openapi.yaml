openapi: 3.0.1
info:
  title: Palo Alto PAN-OS API
  version: "1.2.0"
  description: >-
    Read and write operations for PAN-OS 11.1 security rules, address objects, and
    address groups. Authentication is supplied by the Security Copilot manifest
    in the X-PAN-KEY header.
servers:
  - url: https://firewall.example.com
paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules
      summary: List existing PAN-OS security policy rules

  /restapi/v11.1/Objects/Addresses:
    get:
      operationId: ListAddressObjects
      summary: List existing PAN-OS address objects
    post:
      operationId: CreateAddressObject
      summary: Create a new address object
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - in: query
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressObjectRequest'
      responses:
        '200':
          description: Address object created.

  /restapi/v11.1/Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      summary: List existing PAN-OS address groups
    put:
      operationId: UpdateAddressGroup
      summary: Update an existing address group
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - in: query
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressGroupRequest'
      responses:
        '200':
          description: Address group updated.
components:
  parameters:
    Location:
      in: query
      name: location
      required: true
      schema:
        type: string
        default: vsys
    Vsys:
      in: query
      name: vsys
      required: true
      schema:
        type: string
        default: vsys1
  schemas:
    CreateAddressObjectRequest:
      type: object
      properties:
        entry:
          type: array
          items:
            type: object
            properties:
              '@location': {type: string, example: vsys}
              '@vsys': {type: string, example: vsys1}
              '@name': {type: string, example: 192-168-1-100_32}
              ip-netmask: {type: string, example: 192.168.1.100/32}
    UpdateAddressGroupRequest:
      type: object
      properties:
        entry:
          type: array
          items:
            type: object
            properties:
              '@name': {type: string, example: AbuseCH_Blocked_IPs}
              static:
                type: object
                properties:
                  member:
                    type: array
                    items:
                      type: string
    PanOsResponse:
      type: object
      additionalProperties: true

openapi: 3.0.1

info:
  title: Palo Alto Firewall Rules
  version: 1.0.0
  description: Retrieve Palo Alto firewall security rules through the PAN-OS REST API.

servers:
  - url: https://57.167.90.200
    description: Palo Alto firewall management interface

paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules
      summary: List Palo Alto security rules
      description: Retrieves security rules from vsys1 on the Palo Alto firewall.
      parameters:
        - name: location
          in: query
          required: true
          description: Configuration location containing the security rules.
          schema:
            type: string
            enum:
              - vsys
            default: vsys
        - name: vsys
          in: query
          required: true
          description: Virtual system containing the security rules.
          schema:
            type: string
            default: vsys1
      security:
        - PanApiKey: []
      responses:
        '200':
          description: Security rules retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request or missing parameters.
        '401':
          description: API key authentication failed.
        '403':
          description: The API administrator does not have permission to read security rules.
        '500':
          description: Palo Alto firewall API error.

components:
  securitySchemes:
    PanApiKey:
      type: apiKey
      in: header
      name: X-PAN-KEY

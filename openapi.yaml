openapi: 3.0.1
info:
  title: Palo Alto Firewall Reader
  version: 1.0.0
  description: |
    API used by the PaloAltoFirewallReader Security Copilot plugin.

    Available operations:
    - List firewall security rules
    - List address objects
    - List address groups

servers:
  - url: http://57.167.90.200/restapi/v11.1

paths:
  /Policies/SecurityRules:
    get:
      operationId: ListFirewallRules
      summary: List Palo Alto firewall security rules
      description: |
        Retrieve all PAN-OS security rules from vsys1.
        Use when a user asks to list, show, display, review, or retrieve firewall rules.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys
        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1
      responses:
        '200':
          description: Security rules returned.

  /Objects/Addresses:
    get:
      operationId: ListAddressObjects
      summary: List Palo Alto address objects
      description: |
        Retrieve all address objects from vsys1.
        Use when a user asks to list address objects, IP objects, host objects,
        network objects, or firewall address entries.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys
        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1
      responses:
        '200':
          description: Address objects returned.

  /Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      summary: List Palo Alto address groups
      description: |
        Retrieve all address groups from vsys1.
        Use when a user asks to list address groups, object groups,
        group members, or AbuseCH_Blocked_IPs membership.
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys
        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1
      responses:
        '200':
          description: Address groups returned.

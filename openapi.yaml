openapi: 3.0.1

info:
  title: Palo Alto Firewall Rule Reader
  version: 1.0.0
  description: Read-only access to Palo Alto PAN-OS security policies.

servers:
  - url: https://57.167.90.200

components:
  securitySchemes:
    PaloAltoApiKey:
      type: apiKey
      in: header
      name: X-PAN-KEY

security:
  - PaloAltoApiKey: []

paths:
  /api/:
    get:
      operationId: ListFirewallRules

      summary: List firewall security rules

      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - config
            default: config

        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get
            default: get

        - name: xpath
          in: query
          required: true
          schema:
            type: string
            default: "/config/devices/entry/vsys/entry[@name='vsys1']/rulebase/security/rules"

      responses:
        '200':
          description: Security rules returned successfully.
          content:
            application/xml:
              schema:
                type: string

        '403':
          description: Authentication failed.

        '500':
          description: PAN-OS API error.
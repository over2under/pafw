openapi: 3.0.0

info:
  title: Palo Alto PAN-OS Security Policy Reader
  version: 1.2.0
  description: >
    Read-only plugin for Microsoft Security Copilot that retrieves
    Palo Alto PAN-OS security policies via the PAN-OS XML API.

servers:
  - url: https://57.167.90.200
    description: Palo Alto Management Interface

components:

  securitySchemes:

    PaloAltoApiKey:
      type: apiKey
      in: header
      name: X-PAN-KEY
      description: PAN-OS XML API Key

  parameters:

    ConfigType:
      name: type
      in: query
      required: true
      schema:
        type: string
        enum:
          - config
        default: config

    GetAction:
      name: action
      in: query
      required: true
      schema:
        type: string
        enum:
          - get
        default: get

  responses:

    SuccessResponse:
      description: Successful PAN-OS XML response.

      content:
        application/xml:
          schema:
            type: string

    Unauthorized:
      description: Invalid API key or insufficient permissions.

    ServerError:
      description: PAN-OS API error.

security:
  - PaloAltoApiKey: []

paths:

  /api/:

    get:

      operationId: ListSecurityRules

      summary: List all security policy rules

      description: |
        Retrieves all security rules configured in vsys1.

        Example prompts:

        - List my Palo Alto firewall rules
        - Show all firewall security policies
        - What security rules exist on my firewall?
        - Display source and destination information for all rules

      parameters:

        - $ref: '#/components/parameters/ConfigType'

        - $ref: '#/components/parameters/GetAction'

        - name: xpath

          in: query

          required: true

          schema:
            type: string

            default: "/config/devices/entry/vsys/entry[@name='vsys1']/rulebase/security/rules"

      responses:

        '200':
          $ref: '#/components/responses/SuccessResponse'

        '403':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/ServerError'

  /api-disabled-rules:

    get:

      operationId: ListDisabledSecurityRules

      summary: List disabled firewall rules

      description: |
        Retrieves all security rules and returns disabled rules.

        Example prompts:

        - Show disabled firewall rules
        - Which Palo Alto rules are disabled?
        - Find inactive firewall policies

      parameters:

        - name: type
          in: query
          required: true
          schema:
            type: string
            default: config

        - name: action
          in: query
          required: true
          schema:
            type: string
            default: get

        - name: xpath
          in: query
          required: true
          schema:
            type: string
            default: "/config/devices/entry/vsys/entry[@name='vsys1']/rulebase/security/rules"

      responses:

        '200':
          $ref: '#/components/responses/SuccessResponse'

        '403':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/ServerError'

  /api-rule-details:

    get:

      operationId: GetSecurityRuleDetails

      summary: Get detailed information about a specific rule

      description: |
        Retrieve the configuration of a specific Palo Alto security rule.

        Example prompts:

        - Show details for rule Allow-Microsoft365
        - Display configuration for rule Internet-Access
        - What does rule Block-TOR do?

      parameters:

        - name: ruleName
          in: query
          required: true

          schema:
            type: string

        - name: type
          in: query
          required: true

          schema:
            type: string

            default: config

        - name: action
          in: query
          required: true

          schema:
            type: string

            default: get

      responses:

        '200':
          $ref: '#/components/responses/SuccessResponse'

        '403':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/ServerError'
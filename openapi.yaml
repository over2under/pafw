openapi: 3.0.1
info:
  title: Palo Alto Firewall Read-Only REST API
  version: "1.0.0"
  description: >-
    Read-only API operations for listing Palo Alto Networks security rules,
    address objects, and address groups from vsys1.
servers:
  - url: http://57.167.90.200/restapi/v11.1
paths:
  /Policies/SecurityRules:
    get:
      operationId: ListFirewallRules
      summary: List firewall security rules
      description: >-
        Lists configured security policy rules in vsys1. Use when a user asks
        for firewall rules, security rules, policy rules, sources,
        destinations, applications, services, or actions.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
      responses:
        "200":
          description: Security rules returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'
        "400": { description: Invalid request. }
        "401": { description: Missing or invalid API key. }
        "403": { description: API account is not authorized. }
        "500": { description: Firewall API error. }
  /Objects/Addresses:
    get:
      operationId: ListAddressObjects
      summary: List address objects
      description: >-
        Lists address objects configured in vsys1, including names and values.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
      responses:
        "200":
          description: Address objects returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'
        "400": { description: Invalid request. }
        "401": { description: Missing or invalid API key. }
        "403": { description: API account is not authorized. }
        "500": { description: Firewall API error. }
  /Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      summary: List address groups
      description: >-
        Lists static or dynamic address groups configured in vsys1 and their members.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
      responses:
        "200":
          description: Address groups returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'
        "400": { description: Invalid request. }
        "401": { description: Missing or invalid API key. }
        "403": { description: API account is not authorized. }
        "500": { description: Firewall API error. }
components:
  parameters:
    Location:
      name: location
      in: query
      required: true
      description: Palo Alto configuration location.
      schema:
        type: string
        enum: [vsys]
        default: vsys
    Vsys:
      name: vsys
      in: query
      required: true
      description: Virtual system to query.
      schema:
        type: string
        enum: [vsys1]
        default: vsys1
  schemas:
    PanOsResponse:
      type: object
      additionalProperties: true
      description: Native PAN-OS REST API JSON response.

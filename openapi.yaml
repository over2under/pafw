openapi: 3.0.1
info:
  title: Palo Alto PAN-OS Firewall REST API
  version: 1.0.0
  description: >-
    Security Copilot API plugin specification for PAN-OS 11.1. It lists security
    rules, address objects, and address groups. PUT operations are documented for
    direct API testing and future platform compatibility; Security Copilot API
    plugins currently do not support write operations.
servers:
  - url: https://firewall.example.com
security:
  - PanApiKey: []
components:
  securitySchemes:
    PanApiKey:
      type: apiKey
      in: header
      name: X-PAN-KEY
  schemas:
    AddressEntry:
      type: object
      additionalProperties: true
      properties:
        '@name': { type: string }
        '@location': { type: string }
        ip-netmask: { type: string }
        fqdn: { type: string }
        description: { type: string }
    AddressUpdateRequest:
      type: object
      required: [entry]
      properties:
        entry:
          type: array
          items: { $ref: '#/components/schemas/AddressEntry' }
    AddressGroupEntry:
      type: object
      additionalProperties: true
      properties:
        '@name': { type: string }
        '@location': { type: string }
        description: { type: string }
        static:
          type: object
          properties:
            member:
              type: array
              items: { type: string }
    AddressGroupUpdateRequest:
      type: object
      required: [entry]
      properties:
        entry:
          type: array
          items: { $ref: '#/components/schemas/AddressGroupEntry' }
  parameters:
    Location:
      name: location
      in: query
      required: true
      description: Configuration location, typically vsys, shared, or device-group.
      schema: { type: string, default: vsys }
    Vsys:
      name: vsys
      in: query
      required: false
      description: Virtual system name when location is vsys.
      schema: { type: string, default: vsys1 }
    Name:
      name: name
      in: query
      required: false
      description: Exact object or rule name. Omit to list all entries.
      schema: { type: string }
paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules
      summary: List firewall security rules
      description: Lists PAN-OS security policy rules for the selected location and virtual system.
      parameters:
        - { $ref: '#/components/parameters/Location' }
        - { $ref: '#/components/parameters/Vsys' }
        - { $ref: '#/components/parameters/Name' }
      responses:
        '200': { description: Security rules returned successfully }
        '400': { description: Invalid PAN-OS request }
        '401': { description: API key rejected }
  /restapi/v11.1/Objects/Addresses:
    get:
      operationId: ListAddressObjects
      summary: List address objects
      description: Lists all address objects or retrieves one object by name.
      parameters:
        - { $ref: '#/components/parameters/Location' }
        - { $ref: '#/components/parameters/Vsys' }
        - { $ref: '#/components/parameters/Name' }
      responses:
        '200': { description: Address objects returned successfully }
        '400': { description: Invalid PAN-OS request }
        '401': { description: API key rejected }
    put:
      operationId: UpdateAddressObject
      summary: Update an address object
      description: Documents the PAN-OS update call. Security Copilot currently blocks write operations.
      parameters:
        - { $ref: '#/components/parameters/Location' }
        - { $ref: '#/components/parameters/Vsys' }
        - name: name
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressUpdateRequest' }
      responses:
        '200': { description: Address object updated successfully }
        '400': { description: Invalid PAN-OS request }
        '401': { description: API key rejected }
  /restapi/v11.1/Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      summary: List address groups
      description: Lists all address groups or retrieves one group by name.
      parameters:
        - { $ref: '#/components/parameters/Location' }
        - { $ref: '#/components/parameters/Vsys' }
        - { $ref: '#/components/parameters/Name' }
      responses:
        '200': { description: Address groups returned successfully }
        '400': { description: Invalid PAN-OS request }
        '401': { description: API key rejected }
    put:
      operationId: UpdateAddressGroup
      summary: Update an address group
      description: Documents the PAN-OS update call. Security Copilot currently blocks write operations.
      parameters:
        - { $ref: '#/components/parameters/Location' }
        - { $ref: '#/components/parameters/Vsys' }
        - name: name
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressGroupUpdateRequest' }
      responses:
        '200': { description: Address group updated successfully }
        '400': { description: Invalid PAN-OS request }
        '401': { description: API key rejected }

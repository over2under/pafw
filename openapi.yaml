openapi: 3.0.1

info:
  title: Palo Alto Firewall Rules
  version: 1.0.0

  description: |
    Retrieve Palo Alto firewall security policies.

servers:
  - url: https://57.167.90.200

paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules

      summary: List Palo Alto Security Rules

      description: |
        Retrieves all Palo Alto firewall security policy rules.

        Example prompts:
        - List firewall rules
        - Show Palo Alto security policies
        - Display access control rules
        - Retrieve firewall configuration
        - Show security rules from vsys1

      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            default: vsys

        - name: vsys
          in: query
          required: true
          schema:
            type: string
            default: vsys1

      security:
        - PanApiKey: []

      responses:
        "200":
          description: Firewall rules successfully returned.
          content:
            application/json:
              schema:
                type: object

        "400":
          description: Bad request.

        "401":
          description: Authentication failed.

        "403":
          description: Authorization failed.

        "500":
          description: Firewall error.

components:
  securitySchemes:
    PanApiKey:
      type: apiKey
      in: header
      name: X-PAN-KEY

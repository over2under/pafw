openapi: 3.0.1
info:
  title: Palo Alto PAN-OS API
  version: "1.2.0"
  description: >-
    Microsoft Security Copilot plugin for Palo Alto PAN-OS 11.1.
    Supports listing security rules, address objects, and address groups.
servers:
  - url: http://57.167.90.200
paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules
      tags:
        - PaloAlto
      summary: List firewall security rules
      description: Retrieve security rules from PAN-OS.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'

  /restapi/v11.1/Objects/Addresses:
    get:
      operationId: ListAddressObjects
      tags:
        - PaloAlto
      summary: List address objects
      description: Retrieve address objects from PAN-OS.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - $ref: '#/components/parameters/ObjectName'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'

  /restapi/v11.1/Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      tags:
        - PaloAlto
      summary: List address groups
      description: Retrieve address groups from PAN-OS.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - $ref: '#/components/parameters/ObjectName'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'

components:
  parameters:
    Location:
      in: query
      name: location
      required: true
      schema:
        type: string
        default: vsys
    Vsys:
      in: query
      name: vsys
      required: true
      schema:
        type: string
        default: vsys1
    ObjectName:
      in: query
      name: name
      required: false
      schema:
        type: string
  schemas:
    PanOsResponse:
      type: object
      properties:
        '@status':
          type: string
        '@code':
          type: string
        result:
          type: object
          properties:
            '@total-count':
              type: string
            '@count':
              type: string
            entry:
              type: array
              items:
                type: object
                additionalProperties: true

openapi: 3.0.1
info:
  title: Palo Alto PAN-OS Read-Only API
  version: "1.2.0"
  description: >-
    Read-only PAN-OS 11.1 REST API operations for listing security rules,
    address objects, and address groups over HTTP. Authentication is supplied
    by the Security Copilot plugin in the X-PAN-KEY request header.
servers:
  - url: http://57.167.90.200
    description: Palo Alto PAN-OS management REST API over HTTP
paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules
      tags:
        - PaloAlto
      summary: List Palo Alto PAN-OS firewall security rules
      description: >-
        Lists security policy rules from the selected PAN-OS configuration
        location and virtual system. Use this operation when the user asks to
        list, show, retrieve, inspect, or review Palo Alto firewall rules,
        security rules, security policies, or rulebase entries.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
      responses:
        '200':
          description: Security rules returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'
        '400':
          description: Invalid request or query parameter.
        '401':
          description: API key missing or invalid.
        '403':
          description: The API account is not authorized for this operation.
        '500':
          description: PAN-OS returned an internal error.

  /restapi/v11.1/Objects/Addresses:
    get:
      operationId: ListAddressObjects
      tags:
        - PaloAlto
      summary: List Palo Alto PAN-OS address objects
      description: >-
        Lists address objects from the selected PAN-OS configuration location
        and virtual system. Use this operation when the user asks for Palo Alto
        address objects, IP objects, host objects, FQDN objects, or network
        objects. An exact object name can optionally be supplied.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - $ref: '#/components/parameters/ObjectName'
      responses:
        '200':
          description: Address objects returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'
        '400':
          description: Invalid request or query parameter.
        '401':
          description: API key missing or invalid.
        '403':
          description: The API account is not authorized for this operation.
        '500':
          description: PAN-OS returned an internal error.

  /restapi/v11.1/Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      tags:
        - PaloAlto
      summary: List Palo Alto PAN-OS address groups
      description: >-
        Lists address groups from the selected PAN-OS configuration location
        and virtual system. Use this operation when the user asks for Palo Alto
        address groups or object groups. An exact group name can optionally be
        supplied.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - $ref: '#/components/parameters/ObjectName'
      responses:
        '200':
          description: Address groups returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'
        '400':
          description: Invalid request or query parameter.
        '401':
          description: API key missing or invalid.
        '403':
          description: The API account is not authorized for this operation.
        '500':
          description: PAN-OS returned an internal error.

components:
  parameters:
    Location:
      in: query
      name: location
      required: true
      description: >-
        PAN-OS configuration location. Use vsys for a standalone firewall
        virtual system. Use shared or device-group only when applicable.
      schema:
        type: string
        enum:
          - vsys
          - shared
          - device-group
        default: vsys

    Vsys:
      in: query
      name: vsys
      required: true
      description: >-
        PAN-OS virtual system name. For a standalone firewall, use vsys1 unless
        another virtual system is required.
      schema:
        type: string
        default: vsys1

    ObjectName:
      in: query
      name: name
      required: false
      description: Optional exact address object or address group name.
      schema:
        type: string

  schemas:
    PanOsResponse:
      type: object
      additionalProperties: true
      properties:
        '@status':
          type: string
        '@code':
          type: string
        result:
          type: object
          additionalProperties: true

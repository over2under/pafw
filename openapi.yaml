openapi: 3.0.1

info:
  title: Palo Alto PAN-OS Read Only API
  version: "1.1.0"
  description: |
    Read-only operations for Palo Alto PAN-OS.

    This API allows Microsoft Security Copilot to:

    - List Security Rules
    - List Address Objects
    - List Address Groups

servers:
  - url: "{InstanceURL}"
    variables:
      InstanceURL:
        default: https://your-firewall

tags:
  - name: SecurityRules
    description: Security policy rules

  - name: AddressObjects
    description: Address objects

  - name: AddressGroups
    description: Address groups

paths:
  /restapi/v11.1/Policies/SecurityRules:
    get:
      operationId: ListSecurityRules
      tags:
        - SecurityRules
      summary: List Security Rules
      description: |
        Returns all PAN-OS Security Rules.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
      responses:
        '200':
          description: Security rules returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'

  /restapi/v11.1/Objects/Addresses:
    get:
      operationId: ListAddressObjects
      tags:
        - AddressObjects
      summary: List Address Objects
      description: |
        Returns all PAN-OS Address Objects.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - in: query
          name: name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Address objects returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'

  /restapi/v11.1/Objects/AddressGroups:
    get:
      operationId: ListAddressGroups
      tags:
        - AddressGroups
      summary: List Address Groups
      description: |
        Returns all PAN-OS Address Groups.
      parameters:
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/Vsys'
        - in: query
          name: name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Address groups returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanOsResponse'

components:
  parameters:
    Location:
      in: query
      name: location
      required: true
      schema:
        type: string
        default: vsys
        enum: [vsys, shared, device-group]

    Vsys:
      in: query
      name: vsys
      required: true
      schema:
        type: string
        default: vsys1

  schemas:
    PanOsResponse:
      type: object
      additionalProperties: true
      properties:
        '@status':
          type: string
        '@code':
          type: string
        result:
          type: object
          additionalProperties: true
